<script>
// Old or mistyped links land here; send them to the closest live page.
(function(){var p=(location.pathname+location.search+location.hash).toLowerCase(),to="/electionlab/";
if(p.indexOf("bluedog")>=0)to="/electionlab/caucus/?g=bluedogs";

else if(p.indexOf("weather")>=0||p.indexOf("rdd")>=0||p.indexOf("rain")>=0)to="/electionlab/weather/";
else if(p.indexOf("race")>=0)to="/electionlab/race/"+(location.hash||"");

else if(p.indexOf("electionnight")>=0||p.indexOf("phone")>=0||p.indexOf("ask")>=0)to="/electionnight/";

else if(p.indexOf("esparza")>=0||p.indexOf("boe")>=0)to="/electionlab/race/#BOE1";
location.replace(to);})();
